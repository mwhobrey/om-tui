name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build-cross-platform:
    name: Build CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o dist/om-tui .
          tar -C dist -czf "om-tui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" om-tui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: om-tui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: om-tui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          retention-days: 7

  build-windows:
    name: Build Windows TUI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o dist/om-tui.exe .
          cd dist && zip "../om-tui-windows-${{ matrix.goarch }}.zip" om-tui.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: om-tui-windows-${{ matrix.goarch }}
          path: om-tui-windows-${{ matrix.goarch }}.zip
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-cross-platform, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release
          cp artifacts/om-tui-darwin-arm64/om-tui-darwin-arm64.tar.gz release/
          cp artifacts/om-tui-darwin-amd64/om-tui-darwin-amd64.tar.gz release/
          cp artifacts/om-tui-linux-arm64/om-tui-linux-arm64.tar.gz release/
          cp artifacts/om-tui-linux-amd64/om-tui-linux-amd64.tar.gz release/
          cp artifacts/om-tui-windows-amd64/om-tui-windows-amd64.zip release/
          cp artifacts/om-tui-windows-arm64/om-tui-windows-arm64.zip release/

          # Generate SHA256 checksums for verification
          (cd release && shasum -a 256 * > SHA256SUMS)

      - name: Generate release notes
        id: notes
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          previous=$(git tag --sort=-v:refname | grep -v "^${tag}$" | head -n1)
          if [ -z "$previous" ]; then
            git log --pretty=format:"- %s (%h)" > NOTES.md
          else
            git log "${previous}..${tag}" --pretty=format:"- %s (%h)" > NOTES.md
          fi
          echo "Generated notes from ${previous:-beginning} to ${tag}"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --notes-file NOTES.md
          else
            gh release create "$tag" \
              --title "OM-TUI ${tag}" \
              --notes-file NOTES.md \
              release/*
          fi
